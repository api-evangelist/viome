aid: viome
name: Viome
description: 'Viome (Viome Life Sciences) is a health technology company founded in
  2016 by Naveen Jain that uses metatranscriptomic RNA sequencing — a technique originally
  developed for biodefense at Los Alamos National Laboratory — combined with artificial
  intelligence to measure active gene expression across the gut microbiome, oral microbiome,
  and human cells. From at-home stool, saliva, and finger-prick blood samples the
  company produces over 50 health scores across eight categories (BioAge, Gut Health,
  Oral Health, Energy, Inflammaging, Mood/Memory/Focus, Immunity, and Heart and Metabolic
  Health), personalized food recommendations across more than 370 foods, and custom-blended
  precision supplements and biotics. Products include the Full Body Intelligence,
  Gut Intelligence, and Oral Health Intelligence tests plus the CancerDetect saliva
  screening test for oral and throat cancer. Viome operates in over 100 countries,
  publishes peer-reviewed research in NPJ Genomic Medicine, iScience, and Microbiome,
  and runs a Life Sciences research division. Viome publishes no public developer
  API or machine-readable API contract; its consumer app at my.viome.com is served
  by an undocumented private backend, and the only agent-facing artifact the company
  publishes is a curated llms.txt.'
